org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Published group, held in ONE value. JitPack serves per-module artifacts under
# com.github.<user>.<repo>:<artifactId>; if JitPack ever fails to index this explicit
# group, changing this single line to com.github.Ygaray is the fallback (consumer
# coordinates stay identical because JitPack rewrites the group).
engineGroup=com.github.Ygaray.voice-action-engine
# Local default only. JitPack exports VERSION for each build and that wins (see root build).
engineVersion=0.0.0-local
